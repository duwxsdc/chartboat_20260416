server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-assistant

  # 通义千问 (DashScope) 配置 - 使用 OpenAI 兼容模式
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      # DashScope 基础URL (注意：不要带 /v1 后缀)
      base-url: ${DASHSCOPE_BASE_URL:}
      chat:
        options:
          # 模型名称 - qwen-max 效果更好
          model: ${CHAT_MODEL:}
          temperature: 0.7
          max-tokens: 4096

  # 对话记忆配置
  conversation:
    max-history: 20
    ttl-minutes: 30

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:47.97.124.176}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis2026!}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# JWT配置
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2026}
  expiration: 86400000  # 24小时（毫秒）

# 上下文管理配置
context:
  management:
    # 分层存储阈值
    hot-tier-size: 50
    warm-tier-size: 150
    # 自动清理配置
    auto-cleanup:
      enabled: true
      max-conversation-size: 200
      max-idle-hours: 24
      max-total-size-mb: 500
    # 压缩配置
    compression:
      enabled: true
      threshold-bytes: 1024
    # 摘要配置
    summary:
      enabled: true
      max-messages-before-summary: 100
      summary-model: 
    # 监控配置
    monitor:
      enabled: true
      log-interval-seconds: 60

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# 日志配置
logging:
  level:
    root: INFO
    com.ai.assistant: DEBUG
    org.springframework.ai: INFO
