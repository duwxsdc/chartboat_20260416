server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-assistant

  # 通义千问 (DashScope) 配置 - 使用 OpenAI 兼容模式
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      # DashScope 基础URL (注意：不要带 /v1 后缀)
      base-url: ${DASHSCOPE_BASE_URL:}
      chat:
        options:
          # 模型名称 - qwen-max 效果更好
          model: ${CHAT_MODEL:}
          temperature: 0.7
          max-tokens: 4096
    dashscope:
      api-key:
      # DashScope 基础URL (注意：不要带 /v1 后缀)
      chat:
        model:
        temperature: 0.7
        max-tokens: 4096
  # 对话记忆配置
  conversation:
    max-history: 20
    ttl-minutes: 30

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:!}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24小时（毫秒）

# 上下文管理配置
context:
  management:
    # 分层存储阈值
    hot-tier-size: 50
    warm-tier-size: 150
    # 自动清理配置
    auto-cleanup:
      enabled: true
      max-conversation-size: 200
      max-idle-hours: 24
      max-total-size-mb: 500
    # 压缩配置
    compression:
      enabled: true
      threshold-bytes: 1024
    # 摘要配置
    summary:
      enabled: true
      max-messages-before-summary: 100
      summary-model: qwen-max
    # 监控配置
    monitor:
      enabled: true
      log-interval-seconds: 60

# CORS 配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# 内容过滤配置
content:
  filter:
    # 敏感词过滤
    sensitive-word-enabled: true
    sensitive-words:
      - 政治敏感词
      - 暴力词汇
      - 色情词汇
      - 违法词汇

    # 闲聊拦截
    chit-chat-enabled: true
    chit-chat-patterns:
      - "^你好$"
      - "^在吗$"
      - "^hi$"
      - "^hello$"
      - "^早上好"
      - "^晚上好"
      - "^今天天气"
      - "^你叫什么名字"
      - "^你是谁"
      - "^你能做什么"
      - "^你会什么"

    # 无效输入检测
    invalid-input-enabled: true
    min-input-length: 2
    max-input-length: 1000

    # 闲聊回复
    chit-chat:
      greeting: "你好！我是AI助手，很高兴为您服务。请问有什么我可以帮您的吗？"
      availability: "我在的！请问有什么可以帮助您的？"
      identity: "我是AI智能助手，专门为您提供智能问答服务。"
      capabilities: "我可以为您提供补录平台相关的问题解答，包括ITBA职责、操作流程、权限咨询等。请直接描述您的问题！"

# Graph 检查点配置
graph:
  checkpoint:
    saver:
      # 保存器类型：memory（测试，默认）或 redis（生产）
      type: ${CHECKPOINT_SAVER_TYPE:memory}

# 日志配置
logging:
  level:
    root: INFO
    com.ai.assistant: DEBUG
    org.springframework.ai: INFO
    com.ai.assistant.hook.CapabilityBoundaryHook: DEBUG
    com.ai.assistant.hook.ContentFilterHook: DEBUG
    com.ai.assistant.service.CapabilityBoundaryLogger: WARN
    com.ai.assistant.config.AiConfig: INFO